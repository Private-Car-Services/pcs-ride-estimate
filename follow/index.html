<head>

  <title>Follow the ride · PCS · Private Car Services</title>
  <link rel="stylesheet" href="../app/styles.css?v=46">

  <style>
    #fw-map{height:62vh;min-height:260px;border-radius:14px;margin:6px 0 10px}
    .fw-big{font-size:44px;font-weight:800;color:#f0d48a;text-align:center;margin:4px 0;font-variant-numeric:tabular-nums}
    .fw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin:0 0 10px}
    .fw-grid div{background:rgba(255,255,255,.04);border:1px solid rgba(212,177,90,.28);border-radius:12px;padding:8px 4px}
    .fw-grid b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
    .fw-grid span{font-size:11px;opacity:.8;text-transform:uppercase}
    .fw-row{margin:2px 0}.fw-c{text-align:center}
    /* v76e2: one phone screen, no scrolling. The map fills whatever height is left. */
    html,body{height:100%;margin:0;overflow:hidden !important}
    body[data-app="follow"] .phone{height:100vh;height:100dvh;max-height:100dvh;min-height:0 !important;display:flex;flex-direction:column;overflow:hidden;padding-top:0;padding-bottom:0;box-sizing:border-box}
    body[data-app="follow"] header.top{flex:none;padding:4px 8px !important;margin:0 !important;min-height:0 !important}
    body[data-app="follow"] header.top svg{max-height:34px !important;width:auto !important;height:34px !important}
    body[data-app="follow"] main#app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:0 6px !important;margin:0 !important;overflow:hidden}
    #fl-live{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:6px 8px !important;margin:0 !important;box-sizing:border-box}
    #fl-live > *{flex:none}
    #fl-live .fl-status{font-size:17px !important;padding:5px 8px !important;margin:0 0 4px !important}
    #fl-live .fl-who{font-size:15px !important;margin:0 !important;line-height:1.25}
    #fl-live .fl-car{font-size:14px !important;margin:2px 0 0 !important;line-height:1.25}
    #fl-live .fl-eta:empty,#fl-live .error:empty,#fl-live .fl-row:empty{display:none}
    #fl-live .fl-big{margin:5px 0 !important;gap:6px !important}
    #fl-live .fl-spd,#fl-live .fl-arr{padding:4px 6px !important;border-width:2px !important}
    #fl-live .fl-spd b{font-size:36px !important}
    #fl-live .fl-arr b{font-size:24px !important}
    #fl-live .fl-arr .k,#fl-live .fl-arr span,#fl-live .fl-spd span{font-size:14px !important}
    #fl-live #fl-map{flex:1 1 auto !important;height:auto !important;min-height:120px !important;margin:2px 0 4px !important}
    #fl-live .fl-row{font-size:13px !important;margin:0 !important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #fl-live .fl-upd{font-size:12px !important;margin:2px 0 0 !important}
    #fl-live .fl-call{min-height:40px !important;line-height:40px !important;font-size:17px !important;margin:4px 0 0 !important}
    body[data-app="follow"] footer.app-foot{flex:none;padding:4px 8px calc(env(safe-area-inset-bottom,0px) + 16px) !important;margin:0 !important}
    body[data-app="follow"] footer.app-foot a{padding:3px 12px !important;font-size:14px}
    @media (max-height:720px){ /* iPhone SE and other short screens */
      #fl-live .fl-status{font-size:15px !important;padding:4px 8px !important;margin:0 0 2px !important}
      #fl-live .fl-who,#fl-live .fl-car{display:inline;font-size:13px !important}
      #fl-live .fl-car{margin-left:4px !important}
      #fl-live .fl-spd b{font-size:30px !important}
      #fl-live .fl-arr b{font-size:20px !important}
      #fl-live .fl-arr .k,#fl-live .fl-arr span,#fl-live .fl-spd span{font-size:13px !important}
      #fl-live .fl-spd small,#fl-live .fl-arr small{font-size:12px !important}
      #fl-live .fl-call{min-height:36px !important;line-height:36px !important;font-size:16px !important}
      body[data-app="follow"] header.top svg{max-height:28px !important;height:28px !important}
    }
  </style>
</head>

</body>
</html>
