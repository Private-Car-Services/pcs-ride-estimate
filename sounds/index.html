<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PCS ride alert sound previews</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b2e2a; color: #f5f0e6; margin: 0; padding: 24px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #c9c2b0; margin: 0 0 20px; }
    button {
      display: block; width: 100%; max-width: 420px; margin: 0 0 12px;
      padding: 14px 16px; border: 0; border-radius: 12px;
      background: #c9a227; color: #0b2e2a; font-size: 1rem; font-weight: 600;
    }
    button:active { opacity: 0.85; }
    .fine { font-size: 0.85rem; color: #9a9385; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Private Car Services — alert sounds</h1>
  <p>Tap each button to hear a preview. Tell Amanda which number you want.</p>
  <button type="button" data-sound="chime">1 — Short chime (doorbell)</button>
  <button type="button" data-sound="ping">2 — Two-tone ping</button>
  <button type="button" data-sound="beep">3 — Soft beep</button>
  <button type="button" data-sound="urgent">4 — Urgent alert</button>
  <p class="fine">Needs a tap to unlock sound on iPhone. Keep this tab open while testing.</p>
  <script>
    var ctx;
    function ac() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }
    function tone(freq, start, dur, vol) {
      var c = ac();
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      o.connect(g); g.connect(c.destination);
      o.start(start); o.stop(start + dur + 0.02);
    }
    function play(kind) {
      var c = ac();
      var t = c.currentTime + 0.02;
      if (kind === "chime") { tone(880, t, 0.22, 0.35); tone(659.25, t + 0.28, 0.45, 0.32); }
      else if (kind === "ping") { tone(1200, t, 0.12, 0.3); tone(1600, t + 0.2, 0.14, 0.28); }
      else if (kind === "beep") { tone(740, t, 0.18, 0.25); }
      else if (kind === "urgent") {
        tone(980, t, 0.1, 0.4);
        tone(980, t + 0.17, 0.1, 0.4);
        tone(980, t + 0.34, 0.1, 0.4);
      }
    }
    document.querySelectorAll("button[data-sound]").forEach(function (btn) {
      btn.addEventListener("click", function () { play(btn.getAttribute("data-sound")); });
    });
  </script>
</body>
</html>
